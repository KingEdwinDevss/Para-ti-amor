<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">

    <title>FLORES PROTEGIDAS</title>
    <style>
        /* Estilos generales */
        body, html { 
            margin: 0; 
            padding: 0; 
            background-color: #000; 
            height: 100%; 
            overflow: hidden; 
        }
        
        /* Pantalla de inicio para permitir el audio (evita bloqueos del navegador) */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffff00;
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 1s ease;
            text-align: center;
            padding: 20px;
        }

        /* Estilos para los puntitos amarillos */
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background-color: #ffff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00;
            animation: fall linear infinite;
            z-index: 10;
        }

        @keyframes fall {
            0% { transform: translateY(-100px) translateX(0); }
            100% { transform: translateY(100vh) translateX(var(--wind, 30px)); }
        }

        .container {
            position: relative;
            overflow: hidden;
            min-height: 100vh;
        }

       /* Aura morada gigante que cubre la página */
        body::before {
            content: "";
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300vw;
            height: 170vh;
            background: radial-gradient(
                circle,
                rgba(138, 43, 226, 0.15) 0%, 
                rgba(75, 0, 130, 0.1) 40%,
                rgba(0, 0, 0, 0) 70%
            );
            border-radius: 50%;
            z-index: -1;
            opacity: 0.7;
            animation: aura-expand 8s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes aura-expand {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.5; }
        }

        .flowers { position: relative; z-index: 5; }

        /* Efecto de aura que sube y forma texto */
        .aura-text {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            z-index: 20;
            pointer-events: none;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            line-height: 1.5;
        }

        .aura-text span {
            display: inline-block;
            color: #8a2be2;
            text-shadow: 0 0 10px #8a2be2, 0 0 20px #8a2be2;
            font-size: 28px;
            opacity: 1;
            margin: 5px 1px;
        }

        /* Cursor parpadeante */
        .cursor {
            display: inline-block;
            width: 12px;
            height: 28px;
            background-color: #8a2be2;
            margin-left: 5px;
            animation: blink 0.7s infinite;
            vertical-align: bottom;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Cambiar el color de las raíces (tallos) a verde */
        .flower__line {
            background-color: #107b17 !important;
            box-shadow: 0 0 5px #107b17, 0 0 10px #107b17 !important;
        }

        /* Estilo para el texto final */
        .final-message {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            text-align: center;
            color: #8a2be2;
            text-shadow: 0 0 15px #8a2be2;
            opacity: 0;
            z-index: 30;
            pointer-events: none;
            font-size: 28px;
            line-height: 1.6;
            width: 100%;
            max-width: 800px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .final-message.active {
            color: yellow;
            text-shadow: 0 0 20px yellow, 0 0 40px yellow, 0 0 80px yellow, 0 0 100px yellow; 
            animation: text-pulse 0.5s infinite alternate;
        }

        @keyframes text-pulse {
            from { text-shadow: 0 0 30px yellow, 0 0 50px yellow; }
            to { text-shadow: 0 0 40px yellow, 0 0 70px yellow, 0 0 100px yellow; }
        }

        /* Modificaciones para la flor */
        .flower__leaf {
            background-color: #0ca518 !important;
            box-shadow: 0 0 10px #0ca518, 0 0 20px #0ca518 !important;
        }

        .flower__leaf::before {
            background-color: #26b31f !important;
            box-shadow: 0 0 10px #4cb12d, 0 0 20px #0ea42c !important;
        }

        .flower__light {
            background-color: yellow !important;
            box-shadow: 0 0 5px yellow, 0 0 10px #ccea08 !important;
        }

        /* Aura que sube desde la flor */
        .flower-aura {
            position: fixed;
            bottom: -100vh;
            left: 50%;
            transform: translateX(-50%);
            width: 1200px;
            height: 150vh;
            background: linear-gradient(to top, 
                      rgba(238, 246, 7, 0.9) 0%,
                      rgba(211, 214, 12, 0.6) 30%,
                      rgba(139, 157, 5, 0.3) 60%,
                      transparent 90%);
            border-radius: 50% 50% 0 0;
            filter: blur(30px);
            z-index: 15;
            opacity: 1;
            transition: bottom 1.5s ease-out, opacity 1s ease-out;
        }
    </style>
</head>

    <script>
        // Lógica de inicio con interacción
        window.addEventListener('load', function() {
            const startOverlay = document.getElementById('start-overlay');
            const backgroundMusic = document.getElementById('background-music');
            
            if (startOverlay) {
                startOverlay.addEventListener('click', function() {
                    startOverlay.style.opacity = '0';
                    setTimeout(() => { startOverlay.style.display = 'none'; }, 1000);
                    
                    if (backgroundMusic) {
                        backgroundMusic.play().catch(error => console.log('Error de audio:', error));
                    }
                    
                    setTimeout(startParticles, 3000);
                    setTimeout(startEffectsSequence, 8000);
                });
            }
        });

        // Partículas amarillas
        let PARTICLE_INTENSITY = 50;
        let PARTICLE_SPAWN_RATE = 500;
        const PARTICLE_SPEED = 0.5;
        const WIND_INTENSITY = 20;
        let particleInterval;

        function startParticles() {
            const particles = document.getElementById('particles');
            if (!particles) return;

            for (let i = 0; i < PARTICLE_INTENSITY; i++) {
                createParticle();
            }
            let intensityIncreaseInterval = setInterval(() => {
                PARTICLE_INTENSITY += 20;
                PARTICLE_SPAWN_RATE = Math.max(40, PARTICLE_SPAWN_RATE - 30);
                for (let i = 0; i < 10; i++) { createParticle(); }
                
                if (PARTICLE_INTENSITY > 400 && PARTICLE_SPAWN_RATE <= 50) {
                    clearInterval(intensityIncreaseInterval);
                    PARTICLE_INTENSITY = 600;
                    PARTICLE_SPAWN_RATE = 40;
                    clearInterval(particleInterval);
                    particleInterval = setInterval(createParticle, PARTICLE_SPAWN_RATE);
                } else if (!particleInterval) {
                    particleInterval = setInterval(createParticle, PARTICLE_SPAWN_RATE);
                }
            }, 1000);
            
            setInterval(() => {
                const wind = (Math.random() * WIND_INTENSITY * 2) - WIND_INTENSITY;
                document.documentElement.style.setProperty('--wind', `${wind}px`);
            }, 2000);
        }

        function createParticle() {
            const particles = document.getElementById('particles');
            if (!particles) return;

            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const size = Math.random() * 4 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.opacity = Math.random() * 0.7 + 0.3;
            
            const left = Math.random() * 100;
            const duration = Math.random() * PARTICLE_SPEED + PARTICLE_SPEED;
            const delay = Math.random() * 2;
            const tilt = (Math.random() * 20) - 10;
            const wind = (Math.random() * WIND_INTENSITY) - (WIND_INTENSITY / 2);
            
            particle.style.left = left + 'vw';
            particle.style.animationDelay = delay + 's';
            particle.style.animationDuration = duration + 's';
            particle.style.transform = `rotate(${tilt}deg)`;
            particle.style.setProperty('--wind', `${wind}px`);
            
            particles.appendChild(particle);
            
            setTimeout(() => {
                if (particle.parentNode) { particle.remove(); }
            }, (duration + delay) * 1000 + 500);
        }
        
        // Efectos de aura y secuencia de texto
        function startEffectsSequence() {
            const aura = document.createElement('div');
            aura.className = 'flower-aura';
            document.body.appendChild(aura);
            
            aura.style.opacity = '1';
            
            setTimeout(() => { aura.style.bottom = '0'; }, 50);
            setTimeout(() => { showHackerText(); }, 2000);
            
            setTimeout(() => {
                aura.style.opacity = '0';
                setTimeout(() => { if (aura.parentNode) aura.remove(); }, 1000);
            }, 10000);
        }
        
        // Lógica del texto que incluye los saltos de línea y el mensaje completo
        function showHackerText() {
            const message = "¡Feliz día de las flores amarillas!\n\nMás hermosa que las flores eres tú mi amor, te amo ❤️";
            const auraText = document.getElementById('aura-text');
            const finalMessage = document.getElementById('final-message');
            
            if (!auraText || !finalMessage) return;

            auraText.innerHTML = '';
            auraText.style.opacity = '1';
            
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            auraText.appendChild(cursor);
            
            const characters = message.split('');
            let currentIndex = 0;
            let currentWordSpan = null; 
            
            function showNextCharacter() {
                if (currentIndex < characters.length) {
                    const char = characters[currentIndex];
                    
                    if (char === '\n') {
                        auraText.insertBefore(document.createElement('br'), cursor);
                        currentWordSpan = null;
                    } else {
                        if (!currentWordSpan || (currentIndex > 0 && characters[currentIndex-1] === ' ')) {
                            currentWordSpan = document.createElement('span');
                            auraText.insertBefore(currentWordSpan, cursor);
                        }
                        
                        if (char === ' ') {
                            currentWordSpan.innerHTML += '&nbsp;';
                        } else {
                            currentWordSpan.textContent += char;
                        }
                    }
                    
                    currentIndex++;
                    setTimeout(showNextCharacter, 100);
                } else {
                    if (cursor.parentNode) cursor.remove();
                    
                    setTimeout(() => {
                        auraText.style.opacity = '0';
                        auraText.style.transition = 'opacity 1s ease-out';
                        
                        setTimeout(() => {
                            finalMessage.innerHTML = message.replace(/\n/g, '<br>');
                            finalMessage.style.opacity = '1';
                            finalMessage.style.transition = 'opacity 1s ease-in';
                            
                            setTimeout(() => {
                                finalMessage.classList.add('active');
                            }, 1000);
                        }, 1000);
                    }, 2000);
                }
            }
            showNextCharacter();
        }
    </script>

</body>
